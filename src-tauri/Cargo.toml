[package]
name = "bili-live-hime"
version = "0.5.4"
description = "A Tauri App"
authors = ["Rsplwe <rsplwe@anon.tokyo>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bili_live_hime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` is intentionally not a hard dependency: Tauri enables devtools
# automatically on debug builds, while release builds must not ship a web
# inspector. Opt in explicitly with `cargo build --features devtools`.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
keyring = "4.2"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
brotli = "8.0.4"
flate2 = "1.1.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"

[profile.release]
lto = true
panic = "abort"
strip = true 
